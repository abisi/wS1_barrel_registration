<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Barrel Fit Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* One page per brain: Compare (fits on one canvas, flicker A/B, probe barrel per fit, decide) and Seed (guided clicking
   with a live similarity fit through the seeds). Built by scripts/review_gui.py; data in brains/<ID>.json. */
:root {
  --bg: #f3f4f2; --panel: #ffffff; --ink: #1c211f; --muted: #5f6964; --line: #d9ddd9;
  --accent: #0f7b6c; --accent-soft: #d8efea; --good: #1a7f37; --bad: #b42318; --warn: #9a6700;
  --pick: #6d3fc0; --pick-soft: #ece4fa; --redo: #7c3aed;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141816; --panel: #1c211f; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2e3532;
  --accent: #4cc2ad; --accent-soft: #19372f; --good: #4ac26b; --bad: #ff7b72; --warn: #d29922;
  --pick: #b392f0; --pick-soft: #2c2340; --redo: #a78bfa; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141816; --panel: #1c211f; --ink: #e6ebe8; --muted: #9aa5a0; --line: #2e3532;
  --accent: #4cc2ad; --accent-soft: #19372f; --good: #4ac26b; --bad: #ff7b72; --warn: #d29922;
  --pick: #b392f0; --pick-soft: #2c2340; --redo: #a78bfa; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line) }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 9px }
h1 { font-size: 16px; font-weight: 700; margin: 0 }
.prog { font: 12.5px var(--f-mono); color: var(--muted) } .prog b { color: var(--ink); font-weight: 500 }
.bar { width: 110px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden } .bar i { display: block; height: 100%; background: var(--pick); width: 0 }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto }
.chip { font: 500 12.5px var(--f-ui); border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 3px 10px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink) }
.chip .n { font-family: var(--f-mono); opacity: .7; margin-left: 4px }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main.wrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; padding-block: 14px 40px }
nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); align-self: start; max-height: calc(100vh - 84px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px }
.brain { display: grid; grid-template-columns: 1fr auto; gap: 4px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 6px 10px; color: var(--ink); font: 500 12.5px var(--f-mono); cursor: pointer }
.brain[aria-current="true"] { background: var(--accent-soft) }
.tag { font: 600 10.5px var(--f-ui); padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap }
.tag.local { color: var(--good) } .tag.global { color: var(--muted) } .tag.redo { color: var(--redo) } .tag.new { color: var(--warn) } .tag.fit { color: var(--accent) }
select#brainSel { display: none; width: 100%; font: 500 14px var(--f-mono); padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); margin-bottom: 10px }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 8px }
.head h2 { font: 600 22px var(--f-mono); margin: 0 }
.tabs { display: flex; gap: 0; margin-left: auto; border: 1px solid var(--line); border-radius: 7px; overflow: hidden }
.tabs button { font: 600 13px var(--f-ui); border: 0; background: var(--panel); color: var(--ink); padding: 6px 14px; cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel) }
.tabs button:disabled { color: var(--muted); cursor: default }
.probe { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 6px; padding: 7px 11px; margin-bottom: 12px; font-size: 13px }
.probe.differ { border-left-color: var(--warn) } .probe.none { border-left-color: var(--line); color: var(--muted) }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start }
.viewer { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px) }
.cv { position: relative; width: min(100%, max(320px, calc(100vh - 300px))); margin: 0 auto; aspect-ratio: 1; background: #000; border-radius: 5px; overflow: hidden; touch-action: none }
.cv canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab }
.cv.seed canvas { cursor: crosshair }
.cv .badge { position: absolute; left: 8px; top: 8px; font: 600 12.5px var(--f-mono); color: #fff; background: rgba(0,0,0,.6); padding: 2px 8px; border-radius: 4px; pointer-events: none }
.vbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; font-size: 12.5px }
.vbar label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap }
.seg button { font: 500 12px var(--f-mono); border: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 3px 8px; cursor: pointer }
.seg button:last-child { border-right: 0 }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff }
.sbtn { font: 600 12.5px var(--f-ui); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.sbtn:disabled { opacity: .45; cursor: default }
.sbtn.primary { border-color: var(--pick); background: var(--pick); color: #fff }
.sbtn.warn { border-color: var(--redo); color: var(--redo) }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px }
.box h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
th { font: 600 10.5px var(--f-ui); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: right; padding: 3px 5px; border-bottom: 1px solid var(--line); cursor: help }
th:first-child, th:nth-child(2) { text-align: left }
td { padding: 5px; border-bottom: 1px solid var(--line); font: 12.5px var(--f-mono); text-align: right; vertical-align: middle }
td.l { text-align: left; font-family: var(--f-ui) }
tr.isA td { background: color-mix(in srgb, #06b6d4 12%, transparent) }
tr.isB td { background: color-mix(in srgb, #f59e0b 12%, transparent) }
tr.mine td:nth-child(2) { box-shadow: inset 3px 0 0 var(--pick) }
td .best { font-weight: 600; color: var(--good) }
td .k { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px }
.kind { font: 600 10.5px var(--f-ui); color: var(--redo); margin-left: 4px }
.ab { display: inline-flex; gap: 3px }
.ab button { font: 600 11px var(--f-mono); width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; padding: 0 }
.ab button.a[aria-pressed="true"] { background: #06b6d4; border-color: #06b6d4; color: #000 }
.ab button.b[aria-pressed="true"] { background: #f59e0b; border-color: #f59e0b; color: #000 }
.decide { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px }
.decide button { font: 600 13px var(--f-ui); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer }
.decide button[aria-pressed="true"].d-local { background: var(--pick); border-color: var(--pick); color: #fff }
.decide button[aria-pressed="true"].d-global { background: var(--muted); border-color: var(--muted); color: var(--panel) }
.decide button[aria-pressed="true"].d-redo { background: var(--redo); border-color: var(--redo); color: #fff }
.decide button:disabled { opacity: .45; cursor: default }
textarea { width: 100%; min-height: 40px; resize: vertical; font: 13px var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px }
.oldnote { font-size: 12.5px; color: var(--muted); margin: 4px 0 6px; display: flex; gap: 8px; align-items: baseline }
.oldnote s { color: var(--muted) }
.msg { font-size: 12.5px; color: var(--muted); min-height: 18px; margin-top: 4px } .msg.err { color: var(--bad) }
.help { font-size: 12px; color: var(--muted); margin: 6px 0 0 } .help kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px }
.target { font: 600 20px var(--f-mono); color: var(--accent) }
.seeds li { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; align-items: baseline; font: 12.5px var(--f-mono); padding: 2px 0; border-bottom: 1px dashed var(--line) }
.seeds ul { list-style: none; margin: 0; padding: 0 }
.seeds .ok { color: var(--good) } .seeds .mid { color: var(--warn) } .seeds .bad { color: var(--bad); font-weight: 600 }
.seeds button { font-size: 11px; border: 0; background: none; color: var(--muted); cursor: pointer }
.fitsum { font: 12.5px var(--f-mono); margin-top: 8px }
.chips { display: flex; flex-wrap: wrap; gap: 3px }
.chips button { font: 500 11.5px var(--f-mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.chips button.placed { background: var(--accent-soft) }
.chips button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
details.info summary { cursor: pointer; font-weight: 600; font-size: 13px }
details.info dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; margin: 8px 0 0 }
details.info dt { font-weight: 600 } details.info dd { margin: 0 }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0, 1fr) } .viewer { position: static } }
@media (max-width: 760px) { main.wrap { grid-template-columns: minmax(0, 1fr) } nav { display: none } select#brainSel { display: block } .filters { margin-left: 0 } }
</style>

<header><div class="wrap">
  <h1>Barrel fit review</h1>
  <span class="prog"><b id="nDone">0</b> / <span id="nAll">0</span> decided</span>
  <span class="bar" aria-hidden="true"><i id="barFill"></i></span>
  <div class="filters" role="group" aria-label="Filter brains" id="filters"></div>
</div></header>

<main class="wrap">
  <nav id="list" aria-label="Brains"></nav>
  <section style="min-width:0">
    <label for="brainSel" hidden>Brain</label><select id="brainSel"></select>
    <div id="view"><p class="help">Loading…</p></div>
  </section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COL = { A: "#06b6d4", B: "#f59e0b", G: "rgba(255,255,255,.75)", P: "#22c55e", wS1: "#ef4444", trk: "#cbd5e1" };
const GUIDE = ["Alpha", "Beta", "Gamma", "Delta", "A1", "B1", "C1", "D1", "E1", "C2", "D2", "E2", "C3", "E3"];
const FILTERS = [["todo", "To decide"], ["ws1", "wS1 probe"], ["seed", "Seeding"], ["all", "All"]];
let M = null, db = null, canWrite = true;
const DB = { picks: {}, seeds: {}, requests: {}, status: {} };
const DET = {}, IMG = {};
const S = { b: null, tab: "compare", filter: "todo", A: null, B: null, bg: "fit", mode: "overlay", flick: false, showB: false,
  names: true, glob: false, hold: false, sm: "band", sch: 0, ssh: 0, sslab: "auto", target: null, skipped: {}, pts: {}, seedNote: {}, dirty: {} };

/* ------------------------------------------------------------------ helpers */
const det = () => DET[S.b];
const meta = (b = S.b) => M.brains.find((x) => x.brain === b);
const img = (src) => IMG[src] || (IMG[src] = Object.assign(new Image(), { src }));
function decisionOf(p) {
  if (!p || !p.variant) return null;
  if (p.decision) return p.decision;
  if (p.variant !== "none") return "use_local";
  return /redo|redone|sharpen/i.test(p.note || "") ? "redo" : "use_global";
}
function newestRefit(m) { return Math.max(0, ...m.variants.filter((v) => v.kind !== "auto").map((v) => v.made)); }
function isNew(m) { const p = DB.picks[m.brain]; return !!p && newestRefit(m) > Date.parse(p.at) / 1000; }
function fitState(b) {
  const st = DB.status[b], rq = DB.requests[b];
  if (st && (!rq || Date.parse(st.at) >= Date.parse(rq.at))) return st.state === "fitting" ? "fitting" : null;
  return rq ? "requested" : null;
}
function todo(m) { return !decisionOf(DB.picks[m.brain]) || isNew(m); }
function shown() {
  return M.brains.filter((m) => S.filter === "all" ? true : S.filter === "ws1" ? m.wS1 : S.filter === "seed" ? m.seed : todo(m));
}
function setMsg(t, err) { const e = $("#msg"); if (e) { e.textContent = t; e.className = "msg" + (err ? " err" : ""); } }

/* ------------------------------------------------------------------ brain list */
function renderList() {
  $("#filters").innerHTML = FILTERS.map(([k, t]) => {
    const n = M.brains.filter((m) => k === "all" ? true : k === "ws1" ? m.wS1 : k === "seed" ? m.seed : todo(m)).length;
    return `<button class="chip" data-f="${k}" aria-pressed="${S.filter === k}">${t}<span class="n">${n}</span></button>`;
  }).join("");
  $("#filters").querySelectorAll(".chip").forEach((c) => c.onclick = () => { S.filter = c.dataset.f; const v = shown(); if (v.length && !v.includes(meta())) select(v[0].brain); else render(); });
  const vis = shown();
  $("#list").innerHTML = vis.length ? "" : `<p class="help" style="padding:10px">Nothing here.</p>`;
  $("#brainSel").innerHTML = "";
  vis.forEach((m) => {
    const d = decisionOf(DB.picks[m.brain]), st = fitState(m.brain);
    const tags = [d === "use_local" ? `<span class="tag local">local</span>` : d === "use_global" ? `<span class="tag global">global</span>` : d === "redo" ? `<span class="tag redo">redo</span>` : "",
      isNew(m) ? `<span class="tag new">new fits</span>` : "", st ? `<span class="tag fit">${st}</span>` : ""].join(" ");
    const btn = document.createElement("button");
    btn.className = "brain"; btn.setAttribute("aria-current", m.brain === S.b);
    btn.innerHTML = `<span>${m.brain}${m.wS1 ? ' <span title="wS1 probe" style="color:' + COL.wS1 + '">●</span>' : ""}</span><span>${tags}</span>`;
    btn.onclick = () => select(m.brain);
    $("#list").appendChild(btn);
    $("#brainSel").insertAdjacentHTML("beforeend", `<option value="${m.brain}"${m.brain === S.b ? " selected" : ""}>${m.brain}${d ? " · " + d.replace("use_", "") : ""}</option>`);
  });
  const n = M.brains.filter((m) => decisionOf(DB.picks[m.brain])).length;
  $("#nDone").textContent = n; $("#nAll").textContent = M.brains.length; $("#barFill").style.width = 100 * n / M.brains.length + "%";
}

async function select(b) {
  S.b = b;
  if (!DET[b]) {
    renderList(); $("#view").innerHTML = `<p class="help">Loading ${esc(b)}…</p>`;
    try { DET[b] = await (await fetch(`brains/${b}.json`)).json(); } catch (e) { $("#view").innerHTML = `<p class="msg err">Could not load ${esc(b)}. Reload the page.</p>`; return; }
    if (S.b !== b) return;
  }
  const m = meta(), p = DB.picks[b];
  const pv = p && m.variants.find((v) => v.id === p.variant);
  S.A = pv ? pv.id : m.variants[0].id;
  const refit = m.variants.filter((v) => v.kind !== "auto" && v.id !== S.A).sort((x, y) => y.made - x.made)[0];
  S.B = (refit || m.variants.find((v) => v.id !== S.A) || {}).id || null;
  if (S.tab === "seed" && !det().seed) S.tab = "compare";
  if (!S.pts[b]) S.pts[b] = Object.assign({}, (DB.seeds[b] || {}).points_flat_rc || {});
  if (S.seedNote[b] == null) S.seedNote[b] = (DB.seeds[b] || {}).note || "";
  S.target = nextTarget();
  V.fitted = false; V.w = 0;
  render();
}

/* ------------------------------------------------------------------ canvas viewer (zoom / pan / click / drag) */
const V = { s: 1, ox: 0, oy: 0, w: 0, fitted: false, cv: null, drag: null };
const showingB = () => !!S.B && (S.hold || (S.flick && S.showB));
function viewFit() {
  const d = det(), c = V.cv; if (!c) return;
  const [y0, y1, x0, x1] = d.box, w = c.width;
  V.s = w / Math.max(y1 - y0, x1 - x0); V.ox = -x0 * V.s; V.oy = -y0 * V.s; V.fitted = true;
}
const toScr = (r, c) => [V.ox + c * V.s, V.oy + r * V.s];
const toGrid = (x, y) => [(y - V.oy) / V.s, (x - V.ox) / V.s];
function mountCanvas() {
  const c = $("#cv canvas"); if (!c) return;
  V.cv = c;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth;
  const pw = Math.round(w * dpr);
  c.width = c.height = pw;
  if (V.w && V.w !== pw) { const k = pw / V.w; V.s *= k; V.ox *= k; V.oy *= k; }
  V.w = pw;
  if (!V.fitted) viewFit();
  c.onwheel = (e) => { e.preventDefault(); const r = c.getBoundingClientRect(), k = dpr, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
    const f = Math.exp(-e.deltaY * 0.0015); V.ox = x - (x - V.ox) * f; V.oy = y - (y - V.oy) * f; V.s *= f; draw(); };
  c.onpointerdown = (e) => {
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) * dpr, y = (e.clientY - r.top) * dpr;
    let hit = null;
    if (S.tab === "seed") for (const [k, [pr, pc]] of Object.entries(S.pts[S.b])) { const [sx, sy] = toScr(pr, pc); if (Math.hypot(sx - x, sy - y) < 10 * dpr) hit = k; }
    V.drag = { x, y, ox: V.ox, oy: V.oy, moved: false, hit };
    c.setPointerCapture(e.pointerId);
  };
  c.onpointermove = (e) => {
    if (!V.drag) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) * dpr, y = (e.clientY - r.top) * dpr;
    if (Math.hypot(x - V.drag.x, y - V.drag.y) > 4 * dpr) V.drag.moved = true;
    if (!V.drag.moved) return;
    if (V.drag.hit) { const [gr, gc] = toGrid(x, y); S.pts[S.b][V.drag.hit] = [+gr.toFixed(2), +gc.toFixed(2)]; S.dirty[S.b] = true; draw(); renderSeedSide(); }
    else { V.ox = V.drag.ox + x - V.drag.x; V.oy = V.drag.oy + y - V.drag.y; draw(); }
  };
  c.onpointerup = (e) => {
    const d = V.drag; V.drag = null; if (!d || d.moved || S.tab !== "seed") return;
    if (d.hit) { S.target = d.hit; renderSeedSide(); draw(); return; }
    if (!S.target) return;
    const [gr, gc] = toGrid(d.x, d.y);
    S.pts[S.b][S.target] = [+gr.toFixed(2), +gc.toFixed(2)]; S.dirty[S.b] = true;
    S.target = nextTarget(); renderSeedSide(); draw();
  };
  draw();
}
function tile() {
  const d = det();
  if (S.tab === "seed") {
    const ims = d.seed.images;
    const sh = (i) => (i.sharpen || 0) === S.ssh;
    return ims.find((i) => sh(i) && i.mode === S.sm && i.channel === S.sch && i.slab === S.sslab) || ims.find((i) => sh(i) && i.channel === S.sch) || ims[0];
  }
  const vid = showingB() ? S.B : S.A;
  const key = S.bg === "fit" ? "fit_" + vid : S.bg;
  const t = d.tiles.find((t) => t.key === key) || d.tiles[0];
  return { src: d.sheet, tx: t.tx, ty: t.ty, label: t.label };
}
function path(g, poly, T) {

// similarity (rotation + scale + shift, no reflection) atlas centroid -> clicked point, least squares; points as

  let h = `<div class="box"><h3>Next</h3>${S.target ? `<div>Click <span class="target">${esc(S.target)}</span></div>` : `<div class="help">All guided barrels placed or skipped. Pick any barrel below.</div>`}
    <div style="display:flex;gap:6px;margin-top:8px"><button class="sbtn" id="skip" ${S.target ? "" : "disabled"}>Skip <kbd>s</kbd></button><button class="sbtn" id="undo" ${ks.length ? "" : "disabled"}>Undo <kbd>u</kbd></button></div>
    <div class="help" style="margin-top:8px">Or click any barrel:</div><div class="chips" id="chips">${M.barrels.map((k) => `<button class="${P[k] ? "placed" : ""}" aria-pressed="${k === S.target}" data-k="${k}">${k}</button>`).join("")}</div></div>
    <div class="box seeds"><h3>Seeds (${ks.length})</h3>`;
  if (!ks.length) h += `<p class="help">None yet. Place 5–8 barrels spread over the field.</p>`;
  else {
    h += `<ul>${ks.map((k) => { const q = f ? f.loo[k] : null, cls = "";
      return `<li><span>${esc(k)}</span><span class="${cls}">${q == null ? "–" : Math.round(q) + " µm"}</span><button data-k="${k}" title="Delete ${k}">✕</button></li>`; }).join("")}</ul>`;
    h += f ? `<div class="fitsum">Placement through ${f.n} seeds: scale ${f.scale.toFixed(2)}, rotation ${f.rot.toFixed(0)}°, atlas-shape misfit ${Math.round(f.mean)} µm</div>
      <p class="help">Green outlines: a preview only — the average atlas map, scaled and rotated as one piece to sit on your clicks. Per seed: how far the rigid atlas lands from your click (µm); this is the brain&#39;s shape differing from the average, which the fit then corrects.</p>` : `<p class="help">The placement shows from 3 seeds.</p>`;
  }
  h += `<label class="help" for="snote">Note</label><textarea id="snote" placeholder="Optional">${esc(S.seedNote[b])}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="sbtn" id="save" ${ks.length >= 3 && db && canWrite ? "" : "disabled"}>Save seeds</button><button class="sbtn primary" id="submit" ${ks.length >= 3 && db && canWrite ? "" : "disabled"}>Save and request fit</button></div>
    <p class="help">${sv ? `Saved ${new Date(sv.at).toLocaleString()} (${Object.keys(sv.points_flat_rc || {}).length} seeds)${S.dirty[b] ? " · unsaved changes" : ""}.` : ks.length < 3 ? "At least 3 seeds to save." : "Not saved yet."}${st ? ` Fit: ${st}.` : ""}</p><div class="msg" id="msg"></div></div>`;
  $("#side").innerHTML = h;
  $("#skip").onclick = skip; $("#undo").onclick = undo;
  $("#side").querySelectorAll("#chips button").forEach((x) => x.onclick = () => { S.target = x.dataset.k; renderSeedSide(); draw(); });
  $("#side").querySelectorAll(".seeds li button").forEach((x) => x.onclick = () => { delete P[x.dataset.k]; S.dirty[b] = true; S.target = nextTarget(); renderSeedSide(); draw(); });
  $("#snote").oninput = (e) => { S.seedNote[b] = e.target.value; };
  $("#save").onclick = () => saveSeeds(false); $("#submit").onclick = () => saveSeeds(true);
}
function skip() { if (!S.target) return; (S.skipped[S.b] = S.skipped[S.b] || new Set()).add(S.target); S.target = nextTarget(); renderSeedSide(); draw(); }
function undo() { const P = S.pts[S.b], ks = Object.keys(P); if (!ks.length) return; const k = ks[ks.length - 1]; delete P[k]; S.target = k; S.dirty[S.b] = true; renderSeedSide(); draw(); }
async function saveSeeds(andFit) {
  const b = S.b, t = tile(), at = new Date().toISOString();
  const body = { brain: b, points_flat_rc: S.pts[b], n: Object.keys(S.pts[b]).length, image_channel: t.channel, image_slab: t.slab, image_mode: t.mode, image_sharpen: t.sharpen || 0,
    note: S.seedNote[b] || "", grid: "template flat, 10 um px, [row, col]", at };
  const f = seedFit(); if (f) body.live_mean_residual_um = Math.round(f.mean);
  if (await write("seeds", b, body)) { DB.seeds[b] = body; S.dirty[b] = false; if (andFit) await request("seeded"); renderSeedSide(); }
}

/* ------------------------------------------------------------------ keys */
document.addEventListener("keydown", (e) => {
  if (!M || !det() || e.target.closest("textarea, input, select")) return;
  const k = e.key;
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); step(1); return; }
  if (k === "k" || k === "ArrowUp") { e.preventDefault(); step(-1); return; }
  if (k === "t") { if (det().seed) { S.tab = S.tab === "seed" ? "compare" : "seed"; render(); } return; }
  const m = meta();
  if (S.tab === "compare") {
    const dg = /^Digit([1-9])$/.exec(e.code);
    if (dg) { const v = m.variants[+dg[1] - 1]; if (v) { if (e.shiftKey) S.B = v.id; else S.A = v.id; renderCompareSide(); draw(); } return; }
    if (k === "f") setFlick(!S.flick);
    else if (k === " ") { e.preventDefault(); if (!e.repeat && S.B) { S.hold = true; draw(); } }
    else if (k === "p") decide("use_local"); else if (k === "g") decide("use_global"); else if (k === "r") decide("redo");
  } else {
    const sd = det().seed;
    if (/^[1-9]$/.test(k) && sd.modes[+k - 1]) { S.sm = sd.modes[+k - 1]; renderSeedBar(); draw(); }
    else if (k === "c") { const chs = [...new Set(sd.images.map((i) => i.channel))]; S.sch = chs[(chs.indexOf(S.sch) + 1) % chs.length]; renderSeedBar(); draw(); }
    else if (k === "[" || k === "]") { const i = sd.slabs.indexOf(S.sslab) + (k === "]" ? 1 : -1); S.sslab = sd.slabs[(i + sd.slabs.length) % sd.slabs.length]; renderSeedBar(); draw(); }
    else if (k === "h") { const shs = sd.sharpen || [0]; S.ssh = shs[(shs.indexOf(S.ssh) + 1) % shs.length]; renderSeedBar(); draw(); }
    else if (k === "s") skip(); else if (k === "u" || (k === "z" && (e.ctrlKey || e.metaKey))) { e.preventDefault(); undo(); }
  }
});
document.addEventListener("keyup", (e) => { if (e.key === " " && S.hold) { S.hold = false; draw(); } });
function step(dlt) { const v = shown().map((m) => m.brain); if (!v.length) return; let i = v.indexOf(S.b); i = i < 0 ? 0 : Math.min(v.length - 1, Math.max(0, i + dlt)); select(v[i]).then(() => { const a = $("#list .brain[aria-current='true']"); if (a) a.scrollIntoView({ block: "nearest" }); }); }
$("#brainSel").onchange = (e) => select(e.target.value);
window.addEventListener("resize", () => { if (V.cv) mountCanvas(); });

/* ------------------------------------------------------------------ storage: claude.ai page database, else the local server */
const NOSAVE = "Decisions and seeds can't be saved in this view. Open the page on claude.ai, or locally with: python scripts/review_server.py <page folder>";
async function localDb() {  // scripts/review_server.py: JSON files in <page folder>/db/<collection>/<id>.json
  try { if (!(await fetch("api/ping", { cache: "no-store" })).ok) return null; } catch (e) { return null; }
  const subs = {};
  const pull = async (col) => {
    const o = await (await fetch(`api/${col}`, { cache: "no-store" })).json();
    (subs[col] || []).forEach((cb) => cb({ docs: Object.entries(o).map(([id, x]) => ({ id, data: () => x })) }));
  };
  return {
    local: true,
    collection: (col) => ({ onSnapshot(cb, err) { (subs[col] = subs[col] || []).push(cb); pull(col).catch(() => err && err({ code: "unavailable" })); return () => {}; } }),
    doc: (path) => ({ async set(body) {
      const r = await fetch(`api/${path}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) throw { code: "unavailable", message: "the local server refused the write" };
      pull(path.split("/")[0]);
    } }) };
}

/* ------------------------------------------------------------------ start */
(async () => {
  try { M = await (await fetch("manifest.json")).json(); } catch (e) { $("#view").innerHTML = `<p class="msg err">The brain list did not load. Reload the page.</p>`; return; }
  const first = (shown()[0] || M.brains[0]).brain;
  select(first);
  try { db = await claude.use("db"); } catch (e) { db = null; }
  if (!db) db = await localDb();
  if (!db) { setMsg(NOSAVE, true); return; }
  const t = setTimeout(() => setMsg("Saved decisions can't be reached yet.", true), 10000);
  let first2 = true;
  for (const col of Object.keys(DB)) {
    db.collection(col).onSnapshot((s) => {
      clearTimeout(t);
      const o = {}; s.docs.forEach((d) => { const x = d.data(); if (x) o[d.id] = x; }); DB[col] = o;
      if (col === "seeds") for (const [b, x] of Object.entries(o)) if (!S.dirty[b]) { S.pts[b] = Object.assign({}, x.points_flat_rc || {}); S.seedNote[b] = x.note || ""; }
      if (col === "picks" && first2) { first2 = false; if (S.filter === "todo" && !shown().some((m) => m.brain === S.b) && shown().length) { select(shown()[0].brain); return; } }
      if (S.b && DET[S.b]) { if (col === "picks" && !V.drag) { const p = o[S.b], m = meta(); if (p && m.variants.some((v) => v.id === p.variant) && S.A === m.variants[0].id) S.A = p.variant; } render(); }
    }, (e) => setMsg(`Could not load ${col} (${e.code}).`, true));
  }
})();
</script>
</body></html>
